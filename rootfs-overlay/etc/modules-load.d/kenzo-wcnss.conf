# Qualcomm WCNSS (Pronto/Riva) Wi-Fi + Bluetooth module chain
# Loaded in dependency order at boot by systemd-modules-load.service
#  (so modprobe on boot only runs after / is rw, firmware is reachable,
#   unlike built-in drivers which probe from initramfs).

# 802.11 stack
cfg80211
mac80211

# Qualcomm remoteproc / PIL / SMD glue
qcom_common
qcom_pil_info

# Pronto PIL (firmware loader) + SMD control channel
qcom_wcnss_pil
wcnss_ctrl

# WLAN driver (WCN3660B / WCN3680)
wcn36xx

# Bluetooth stack + Qualcomm BT over SMD
bluetooth
btqca
btqcomsmd

# HID transport (wireless mice/keyboards)
hidp
uhid
