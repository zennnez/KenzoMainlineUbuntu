# Kenzo mobile networking tuning:
# Aggressive TCP keepalives + sticky ARP to survive Wi-Fi radio swings.

# --- TCP keepalives (default: 7200s = 2h before first probe!) ---
# Send first keepalive probe after 60 s of idle, then every 10 s.
# Declare peer dead after 6 missed probes (60 + 6*10 = 120 s total).
net.ipv4.tcp_keepalive_time=60
net.ipv4.tcp_keepalive_intvl=10
net.ipv4.tcp_keepalive_probes=6

# --- ARP / neighbour cache ---
# Keep ARP entries around longer so the default gateway doesn't
# disappear from the cache during a brief radio outage.
net.ipv4.neigh.default.gc_stale_time=120
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2

# --- General wireless resilience ---
# Don't drop packets during link-local reconfig / roaming.
net.ipv4.ip_no_pmtu_disc=0
net.ipv4.tcp_syn_retries=5
net.ipv4.tcp_synack_retries=3

# Allow faster reuse of sockets in TIME-WAIT (helps on reconnect storms).
net.ipv4.tcp_tw_reuse=1
