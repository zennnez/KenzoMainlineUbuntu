# Disable Wi-Fi power management globally on Kenzo.
# WCN3660B power-save modes cause beacon loss (CTRL-EVENT-BEACON-LOSS) and SSH disconnects.
# wifi.powersave values: 0=default, 1=ignore, 2=disabled, 3=enabled
#
# FILE NAME MATTERS: NetworkManager reads conf.d in alphabetical order and the LAST file wins.
# Ubuntu's network-manager ships default-wifi-powersave-on.conf (wifi.powersave=3); this file
# must sort after it ("zz-..."), otherwise power save stays ON ("99-..." sorts before "default-...").
[connection]
wifi.powersave=2

[device]
wifi.scan-rand-mac-address=no
