# /etc/kenzo-battery.conf
# Battery charging cap for 24/7 server operation on Xiaomi Redmi Note 3 (Kenzo)
#
# Caps battery charging at STOP_THRESHOLD (default 60%) instead of 100%.
# Power continues directly from USB VBUS (pass-through) keeping battery at cap.
# Charging resumes if capacity drops to START_THRESHOLD (default 58%).
# If power is physically cut, runs on battery; when power returns, charges up to 60%.

STOP_THRESHOLD=60
START_THRESHOLD=58
CHECK_INTERVAL_SEC=30

