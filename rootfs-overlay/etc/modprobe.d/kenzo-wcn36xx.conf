# Disable firmware/hardware-level power saving on the WCN3660B.
# The Pronto firmware's sleep modes are aggressive and regularly
# cause the host to lose ARP, drop TCP flows, and make SSH sessions
# unreachable until the interface is toggled.

# mac80211 layer: tell the rate control algorithm to stay in
# performance mode; don't drop to power-saving idle rates.
options mac80211 minstrel_vht_only=1
