# kenzo dev image: allow root password login over USB RNDIS / serial.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no

# SSH keepalives — prevent idle disconnects behind NAT / Wi-Fi power save.
# Server probes client every 30s; drops session after 5 failed probes (2.5 min).
ClientAliveInterval 30
ClientAliveCountMax 5
TCPKeepAlive yes
