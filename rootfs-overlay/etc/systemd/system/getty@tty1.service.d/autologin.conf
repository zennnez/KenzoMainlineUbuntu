[Service]
# NOTE: Username is rewritten at build time (build-rootfs.sh) to match $KENZO_USER.
# If you change $KENZO_USER, rebuild rootfs or edit the user= line here (and in /etc/systemd/system/getty@tty1.service.d/autologin.conf on the running phone).
#
# agetty --autologin USER alone already skips the `login:` prompt and hands
# control to /bin/login with the user already selected. We MUST NOT also pass
# '-o' (which prepends a prompt and confuses PAM on 26.04 tty1). We still need
# a matching PAM rule (installed by build-rootfs.sh into /etc/pam.d/login) to
# skip the password prompt itself on /dev/tty1 for this user.
ExecStart=
ExecStart=-/sbin/agetty --noclear --autologin kenzo %I $TERM
# don't clear the screen on logout, so the last boot messages stay visible
TTYVTDisallocate=no
