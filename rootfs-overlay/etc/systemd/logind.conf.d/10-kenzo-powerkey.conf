[Login]
# By default systemd-logind reacts to KEY_POWER by starting a suspend or asking the DE.
# kenzo is a headless phone with just fbcon; suspend rarely works out-of-the-box on
# mainline msm8956, and we want the power key to just blank / unblank the screen.
# So: let logind ignore the key entirely, we handle it ourselves via kenzo-powerkey.service.
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
# Lid events: no lid on a phone.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
