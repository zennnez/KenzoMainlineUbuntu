# Prefer 5 GHz Wi-Fi over 2.4 GHz. See: kenzo-wifi-band status
PREFER_5G=1
# Two-letter regulatory country, e.g. IN, US, DE. Empty = derive it from the timezone.
# Without a country most 5 GHz channels are restricted and 5 GHz networks may not be found.
COUNTRY=IN
# A 5 GHz network is only taken when its signal is at least this good (nmcli percent; 45 is about -77 dBm)
MIN_SIGNAL_5G=45
# ...and at most this many points weaker than the current 2.4 GHz link (5 GHz fades faster)
MAX_DEFICIT=25
# After a failed switch, leave that network alone for this many seconds
COOLDOWN=1800
# 1 = never switch networks while an SSH session is running over Wi-Fi
RESPECT_SSH=1
# NetworkManager autoconnect-priority given to 5 GHz-only profiles (others keep 0)
PRIO_5G=10
# Empty = first wireless interface
IFACE=
# While on 2.4 GHz and no 5 GHz network is known, force a new scan at most this often (seconds).
# Scans take the radio off-channel, which stalls traffic on this chip. 0 = scan on every check.
RESCAN_INTERVAL=1800
